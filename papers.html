    <script>
function toggleNav() {
    document.getElementById("navMobile").classList.toggle("w3-show");
}
window.addEventListener("resize", function() {
    if (window.innerWidth >= 601) document.getElementById("navMobile").classList.remove("w3-show");
});
(function() {
    var page = location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.site-nav a.w3-bar-item').forEach(function(a) {
        if (a.getAttribute('href') === page) a.classList.add('site-nav-active');
    });
})();
    </script>

    <script src="zotero-publications.min.js"></script>
    <script>
        (function() {
            var paperTypes = ['journalArticle', 'conferencePaper', 'thesis', 'manuscript', 'preprint'];
            var zp = new ZoteroPublications({ group: 'type' });
            var promise = zp.getPublications(10978498);
            promise.then(function(data) {
                data.raw = data.data = data.raw.filter(function(item) {
                    return paperTypes.indexOf(item.data.itemType) !== -1;
                });
                var container = document.getElementById('container-pub');
                zp.render(data, container).then(function() {
                    var loading = document.getElementById('zotero-loading');
                    if (loading) loading.remove();
                    data.raw.forEach(function(item) {
                        var el = container.querySelector('[data-item="' + item.key + '"]');
                        if (item.data.itemType === 'thesis') {
                            if (el && item.data.thesisType) {
                                var s = el.querySelector('.zotero-item-subline');
                                if (s) s.textContent = item.data.thesisType + ' — ' + s.textContent;
                            }
                            return;
                        }
                        if (!el || !item.data.creators) return;
                        var authors = item.data.creators
                            .filter(function(c) { return c.creatorType === 'author'; })
                            .map(function(c) {
                                return c.firstName && c.lastName
                                    ? c.firstName + ' ' + c.lastName
                                    : (c.name || '');
                            }).filter(Boolean);
                        if (!authors.length) return;
                        var authorDiv = document.createElement('div');
                        authorDiv.className = 'zotero-item-authors';
                        authorDiv.innerHTML = authors.map(function(name) {
                            return name === 'Hayato Nasu' ? '<strong>' + name + '</strong>' : name;
                        }).join(', ');
                        var header = el.querySelector('.zotero-item-header');
                        if (!header) return;
                        var subline = header.querySelector('.zotero-item-subline');
                        if (subline) {
                            header.insertBefore(authorDiv, subline);
                            if (subline.textContent.trimStart().startsWith('By ')) {
                                var lastComma = subline.textContent.lastIndexOf(', ');
                                subline.textContent = lastComma !== -1 ? subline.textContent.slice(lastComma + 2) : '';
                            }
                        } else { header.appendChild(authorDiv); }
                    });
                    data.raw.forEach(function(item) {
                        var arxivUrl = null;
                        if (item.data.url && /arxiv\.org/i.test(item.data.url)) {
                            arxivUrl = item.data.url;
                        } else if (item.data.extra) {
                            var m = item.data.extra.match(/arxiv[:\s]+(\d{4}\.\d{4,5})/i);
                            if (m) arxivUrl = 'https://arxiv.org/abs/' + m[1];
                        }
                        if (!arxivUrl) return;
                        var el = container.querySelector('[data-item="' + item.key + '"]');
                        if (!el) return;
                        var arxivBtn = document.createElement('a');
                        arxivBtn.href = arxivUrl; arxivBtn.rel = 'nofollow';
                        arxivBtn.className = 'zotero-arxiv-btn';
                        arxivBtn.innerHTML = '<i class="ai ai-arxiv"></i> arXiv';
                        var header = el.querySelector('.zotero-item-header');
                        if (!header) return;
                        var subline = header.querySelector('.zotero-item-subline');
                        if (subline) { subline.appendChild(arxivBtn); }
                        else {
                            var ns = document.createElement('div');
                            ns.className = 'zotero-item-subline';
                            ns.appendChild(arxivBtn);
                            header.appendChild(ns);
                        }
                    });
                    container.querySelectorAll('.zotero-item-title').forEach(function(titleEl) {
                        var hasPdf = false;
                        titleEl.childNodes.forEach(function(node) {
                            if (node.nodeType === Node.TEXT_NODE && /\[PDF\]/.test(node.textContent)) {
                                hasPdf = true;
                                node.textContent = node.textContent.replace(/\s*\[PDF\]/, '');
                            }
                        });
                        var link = titleEl.querySelector('a');
                        var pdfUrl = link ? link.href : '';
                        if (link) link.replaceWith(document.createTextNode(link.textContent));
                        if (!hasPdf || !pdfUrl) return;
                        var btn = document.createElement('a');
                        btn.href = pdfUrl; btn.rel = 'nofollow';
                        btn.className = 'w3-button w3-green w3-round-large w3-small zotero-pdf-btn';
                        btn.innerHTML = '<i class="fa fa-download"></i> PDF';
                        var header = titleEl.closest('.zotero-item-header');
                        if (!header) return;
                        var subline = header.querySelector('.zotero-item-subline');
                        if (subline) { subline.appendChild(btn); }
                        else {
                            var ns2 = document.createElement('div');
                            ns2.className = 'zotero-item-subline';
                            ns2.appendChild(btn);
                            header.appendChild(ns2);
                        }
                    });
                });
            });
            promise.catch(function(reason) { console.warn(reason); });
        })();
    </script>

    </body>
</html>
