    <div class="w3-content w3-margin-top" style="max-width:1400px;">
        <div class="w3-container">
            <div id="main" class="w3-white w3-row-padding w3-margin-top" style="margin-left:3%;">

    <h1>Research Talks</h1>

    <div id="container-pres"><p id="zotero-loading" style="font-size:1.1em;">Loading&hellip;</p></div>

            </div>
        </div>
    </div>

    <script src="zotero-publications.min.js"></script>
    <script>
        (function() {
            var zp = new ZoteroPublications({ group: false, expand: 'all' });
            var promise = zp.getPublications(10978498);
            promise.then(function(data) {
                var loading = document.getElementById('zotero-loading');
                if (loading) loading.remove();
                data.raw = data.data = data.raw.filter(function(item) {
                    return item.data.itemType === 'presentation';
                });
                var container = document.getElementById('container-pres');
                zp.render(data, container).then(function() {
                    data.raw.forEach(function(item) {
                        var el = container.querySelector('[data-item="' + item.key + '"]');
                        if (!el) return;
                        if (item.data.extra && /^featured:\s*true/im.test(item.data.extra)) {
                            el.classList.add('zotero-item-featured');
                        }
                        var parts = [item.data.meetingName, item.data.place].filter(Boolean)
                            .concat(item.data.date ? [item.data.date] : []);
                        var subline = el.querySelector('.zotero-item-subline');
                        if (parts.length) {
                            if (subline) { subline.textContent = parts.join(', '); }
                            else {
                                var header = el.querySelector('.zotero-item-header');
                                if (header) {
                                    var ns = document.createElement('div');
                                    ns.className = 'zotero-item-subline';
                                    ns.textContent = parts.join(', ');
                                    header.appendChild(ns);
                                }
                            }
                        }
                        if (item.data.url) {
                            var urlBtn = document.createElement('a');
                            urlBtn.href = item.data.url;
                            urlBtn.target = '_blank';
                            urlBtn.rel = 'noopener noreferrer';
                            var isYouTube = /youtube\.com|youtu\.be/.test(item.data.url);
                            urlBtn.className = 'w3-button w3-blue w3-round-large w3-small zotero-pdf-btn';
                            urlBtn.innerHTML = isYouTube ? '<i class="fa-brands fa-youtube"></i> YouTube' : '<i class="fa fa-link"></i> Link';
                            var header = el.querySelector('.zotero-item-header');
                            if (header) {
                                var sublineUrl = header.querySelector('.zotero-item-subline');
                                if (sublineUrl) { sublineUrl.appendChild(urlBtn); }
                                else {
                                    var ns3 = document.createElement('div');
                                    ns3.className = 'zotero-item-subline';
                                    ns3.appendChild(urlBtn);
                                    header.appendChild(ns3);
                                }
                            }
                        }
                        if (item.data.abstractNote) {
                            var details = document.createElement('details');
                            details.className = 'zotero-item-abstract-details';
                            var summary = document.createElement('summary');
                            summary.className = 'zotero-item-abstract-toggle';
                            summary.textContent = 'Abstract';
                            var abs = document.createElement('div');
                            abs.className = 'zotero-item-abstract';
                            var urlPattern = /(https?:\/\/[^\s]+)/g;
                            var parts = item.data.abstractNote.split(urlPattern);
                            parts.forEach(function(part) {
                                if (urlPattern.test(part)) {
                                    var a = document.createElement('a');
                                    a.href = part;
                                    a.textContent = part;
                                    a.target = '_blank';
                                    a.rel = 'noopener noreferrer';
                                    abs.appendChild(a);
                                } else {
                                    abs.appendChild(document.createTextNode(part));
                                }
                                urlPattern.lastIndex = 0;
                            });
                            details.appendChild(summary);
                            details.appendChild(abs);
                            el.appendChild(details);
                            (window.MathJax && MathJax.startup
                                ? MathJax.startup.promise
                                : Promise.resolve()
                            ).then(function() {
                                if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([abs]);
                            });
                        }
                    });
                    var hasFeatured = data.raw.some(function(item) {
                        return item.data.extra && /^featured:\s*true/im.test(item.data.extra);
                    });
                    if (hasFeatured) {
                        data.raw.forEach(function(item) {
                            if (item.data.extra && /^featured:\s*true/im.test(item.data.extra)) return;
                            var el = container.querySelector('[data-item="' + item.key + '"]');
                            if (el) el.classList.add('zotero-item-hidden');
                        });
                        var toggleBtn = document.createElement('button');
                        toggleBtn.className = 'filter-toggle-btn';
                        toggleBtn.textContent = 'Show all talks';
                        var showingAll = false;
                        toggleBtn.addEventListener('click', function() {
                            showingAll = !showingAll;
                            container.classList.toggle('show-all', showingAll);
                            toggleBtn.textContent = showingAll ? 'Show featured only' : 'Show all talks';
                        });
                        container.after(toggleBtn);
                    }
                    container.querySelectorAll('.zotero-item-title').forEach(function(titleEl) {
                        var hasPdf = false;
                        titleEl.childNodes.forEach(function(node) {
                            if (node.nodeType === Node.TEXT_NODE && /\[PDF\]/.test(node.textContent)) {
                                hasPdf = true;
                                node.textContent = node.textContent.replace(/\s*\[PDF\]/, '');
                            }
                        });
                        var link = titleEl.querySelector('a');
                        var pdfUrl = link ? link.href : '';
                        if (link) link.replaceWith(document.createTextNode(link.textContent));
                        if (!hasPdf || !pdfUrl) return;
                        var btn = document.createElement('a');
                        btn.href = pdfUrl; btn.rel = 'nofollow';
                        btn.className = 'w3-button w3-green w3-round-large w3-small zotero-pdf-btn';
                        btn.innerHTML = '<i class="fa fa-download"></i> PDF';
                        var header = titleEl.closest('.zotero-item-header');
                        if (!header) return;
                        var subline = header.querySelector('.zotero-item-subline');
                        if (subline) { subline.appendChild(btn); }
                        else {
                            var ns2 = document.createElement('div');
                            ns2.className = 'zotero-item-subline';
                            ns2.appendChild(btn);
                            header.appendChild(ns2);
                        }
                    });
                });
            });
            promise.catch(function(reason) { console.warn(reason); });
        })();
    </script>

    <script>
function toggleNav() {
    document.getElementById("navMobile").classList.toggle("w3-show");
}
window.addEventListener("resize", function() {
    if (window.innerWidth >= 601) document.getElementById("navMobile").classList.remove("w3-show");
});
(function() {
    var page = location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.site-nav a.w3-bar-item').forEach(function(a) {
        if (a.getAttribute('href') === page) a.classList.add('site-nav-active');
    });
})();
    </script>
