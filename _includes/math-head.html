{% comment %}
Shared <head> setup for any layout that renders Markdown content with math
(post.html, paper.html, talk.html, note.html). Expects a hidden
`<div id="latex-preamble"></div>` somewhere in the page for the preamble.sty
macros to be loaded into.
{% endcomment %}
<script>
window.MathJax = {
    startup: {
        // Held off until the preamble.sty macros (fetched below) are
        // in place, so \newcommand definitions from it are available
        // to every $...$/$$...$$ in the page from the first render.
        typeset: false
    },
    tex: {
        // Both delimiter styles work in source: kramdown rewrites
        // $$...$$ to \(...\)/\[...\] before this ever reaches the
        // browser, and bare $...$ passes through kramdown untouched,
        // so MathJax has to be told to recognize it directly.
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    chtml: {
        matchFontHeight: false
    },
    svg: {
        fontCache: 'global'
    }
};
</script>
<script>
// Load MathJax itself, then — once it's both ready and the rest of
// the page has parsed — load the LaTeX macro preamble
// (blog/preamble.sty, a plain LaTeX \newcommand file Jekyll leaves
// untouched) as hidden math, and only then typeset, so the preamble's
// macros are available to every $...$/$$...$$ on the page.
(function () {
    var mathJaxReady = new Promise(function (resolve) {
        var script = document.createElement('script');
        if (navigator.userAgent.includes("Chrome") || navigator.userAgent.includes("Firefox"))
            script.src = "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js";
        else
            script.src = "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js";
        script.async = true;
        script.onload = resolve;
        document.head.appendChild(script);
    });
    var domReady = document.readyState === 'loading'
        ? new Promise(function (resolve) { document.addEventListener('DOMContentLoaded', resolve); })
        : Promise.resolve();

    Promise.all([mathJaxReady, domReady]).then(function () {
        var preambleUrl = "{{ '/blog/preamble.sty' | relative_url }}";
        return fetch(preambleUrl)
            .then(function (res) { return res.ok ? res.text() : ""; })
            .catch(function () { return ""; })
            .then(function (preamble) {
                var el = document.getElementById("latex-preamble");
                if (el) el.textContent = "\\[" + preamble + "\\]";
                return MathJax.startup.promise;
            })
            .then(function () {
                return MathJax.typesetPromise();
            });
    });
})();
</script>
